name: Update co-author Claude model

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  # モデル ID の一覧。公開リポジトリなので資格情報は要らない。
  MODEL_SOURCE: https://raw.githubusercontent.com/anthropics/anthropic-sdk-python/main/src/anthropic/types/model.py

jobs:
  update-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve model names
        id: model
        run: |
          # 公開 SDK のモデル列挙から Opus 系の ID を集める。日付付きの
          # スナップショット（claude-opus-4-5-20251101）は末尾の引用符で除かれる。
          # 最新を無条件に採ると Haiku やプレビュー系を拾うため Opus 系に限定する。
          LATEST_VERSION=$(curl -sS --fail --max-time 30 "${MODEL_SOURCE}" \
            | grep -oE '"claude-opus-[0-9]+(-[0-9]+)?"' \
            | tr -d '"' | sort -u \
            | sed 's/^claude-opus-//' | tr '-' '.' | sort -V | tail -1)
          LATEST="Claude Opus ${LATEST_VERSION}"

          CURRENT=$(grep 'Co-Authored-By:' config/.zsh/lib/functions.zsh \
            | sed 's/.*Co-Authored-By: \(.*\) <noreply.*/\1/' | head -1)

          # trailer の値は "Name <email>" として解釈される。コロンなど余計な
          # 文字が入ると co-author として認識されないため、形を検査する。
          if ! printf '%s' "${LATEST}" | grep -qE '^Claude Opus [0-9]+(\.[0-9]+)?$'; then
            echo "::error::unexpected model name from ${MODEL_SOURCE}: ${LATEST}"
            exit 1
          fi
          # CURRENT が壊れていると sed が空振りし、ファイル間で値がずれたまま成功する。
          if printf '%s' "${CURRENT}" | grep -q ':'; then
            echo "::error::current trailer name is malformed: ${CURRENT}"
            exit 1
          fi

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Latest: ${LATEST}, Current: ${CURRENT}"

      - name: Update and commit if changed
        if: steps.model.outputs.latest != '' && steps.model.outputs.latest != steps.model.outputs.current
        run: |
          LATEST="${{ steps.model.outputs.latest }}"
          CURRENT="${{ steps.model.outputs.current }}"
          sed -i "s|Co-Authored-By: ${CURRENT} <noreply@anthropic.com>|Co-Authored-By: ${LATEST} <noreply@anthropic.com>|" \
            config/.zsh/lib/functions.zsh config/AGENTS.md \
            config/.claude/plugins/chck/plugins/personal-skills/skills/commit/SKILL.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/.zsh/lib/functions.zsh config/AGENTS.md \
            config/.claude/plugins/chck/plugins/personal-skills/skills/commit/SKILL.md
          git commit -m "chore: update co-author model to ${LATEST}"
          git push
