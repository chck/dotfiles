default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=102400]  # can upload <100 MB to github
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: ^config/settings\.json$
      - id: check-merge-conflict
      - id: check-toml
        # Otty repeats open-with-app per entry, which is not valid TOML
        exclude: ^config/otty/config\.toml$
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        # Karabiner-Elements writes karabiner.json without a trailing newline
        exclude: ^config/karabiner/karabiner\.json$
      - id: mixed-line-ending
        args: [--fix=auto]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        # karabiner.json is rewritten by Karabiner-Elements in its own format
        exclude: ^config/(settings|karabiner/karabiner)\.json$
      - id: trailing-whitespace
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.9
    hooks:
      - id: commitizen
        stages: [commit-msg]
