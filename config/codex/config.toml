# Codex user configuration. cookbooks/codex copies this file to
# ~/.codex/config.toml on a machine that has none yet and never deploys it
# again, because Codex writes its own state into the live file; a setting
# changed here has to be applied there by hand.
# Keep authentication, history, logs, caches, and hooks outside this tracked
# file; CODEX_HOME is the root for all of those, not an XDG config directory.

# Escalations out of the sandbox — a write outside the workspace, or the network
# below — go to automatic review instead of stopping for a human. A rejected
# action comes back to the agent with instructions to find a safer route and to
# finish everything it can, so a session runs unattended without the sandbox
# itself being lifted. `--approve-for-me` is the per-invocation form.
#
# `user` is the default and asks; `guardian_subagent` hands the same decision to
# a separate agent. Each review is a model call, so it costs tokens and latency.
# `[auto_review] policy` takes the review criteria as free text.
approvals_reviewer = "auto_review"

# The policy still decides which actions need approval at all; the reviewer
# above decides who answers. `on-failure` and `untrusted` are not usable here:
# the loader silently folds `on-failure` into `on-request` (`codex doctor`
# reports `OnRequest` for both) and fails to load `untrusted` outright. The only
# other working values are `never`, which asks nobody and returns the failure to
# the model, and `granular`, which takes a table of five booleans.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
