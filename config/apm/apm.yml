# apm global manifest, symlinked to ~/.apm/apm.yml by cookbooks/claude.
#
# Skills are declared here and deployed by `apm install -g` to one directory per
# entry in `targets:` below.
#
# Edit this file by hand, then run `apm install -g`. Do NOT run
# `apm install -g <package>`, which rewrites the manifest and would surface as a
# diff in this repository — the same rule as config/mise/config.toml.
name: chck-dotfiles
version: 1.0.0
description: Agent skills for chck/dotfiles
author: chck
# Claude Code reads only its own `<config>/.claude/skills/`, which XDG_CONFIG_HOME
# puts at ~/.config/claude/skills/. Every other agent here follows the shared
# convention and scans ~/.agents/skills/, which is what the `agent-skills` target
# writes — opencode picks the skills up from there with no further wiring.
#
# Do not list individual agents (`opencode`, `codex`, …) instead. Their skill
# deploy path is that same ~/.agents/skills/, so they add nothing, and each also
# claims that agent's MCP config: `codex` writes an untracked ~/.codex/config.toml
# even when codex is not installed, and `opencode` — which apm skips today — would
# target ~/.config/opencode/opencode.json, a symlink to a tracked file here.
targets:
  - claude
  - agent-skills
dependencies:
  apm:
    # First-party skills, kept in this repo. The path must be absolute or
    # tilde-expanded: a relative path is resolved against ~/.apm/ rather than
    # this file, and apm then silently installs nothing (`apm install --dry-run`
    # reports it as installable either way, so it will not catch the mistake).
    # The ghq layout makes this path reproducible across machines.
    - ~/Works/github.com/chck/dotfiles/config/.claude/plugins/chck/plugins/personal-skills
    # ibelick/ui-skills — design-engineer skills (MIT)
    - ibelick/ui-skills/skills/baseline-ui
    - ibelick/ui-skills/skills/create-design-md
    - ibelick/ui-skills/skills/fixing-accessibility
    - ibelick/ui-skills/skills/fixing-metadata
    - ibelick/ui-skills/skills/fixing-motion-performance
    - ibelick/ui-skills/skills/improve-ui
    - ibelick/ui-skills/skills/ui-skills-root
    # anthropics/skills
    - anthropics/skills/skills/frontend-design
    # stablyai/orca — orca CLI skill, paired with cookbooks/orca (MIT)
    - stablyai/orca/skills/orca-cli
  mcp:
    # headroom. The API key is not stored here; the server reads it from the
    # environment (HEADROOM_TELEMETRY is set by this cookbook's zsh block).
    - name: headroom
      registry: false
      transport: stdio
      command: uvx
      args:
        - --from
        - headroom-ai[all]
        - headroom
        - mcp
        - serve
includes: auto
scripts: {}
