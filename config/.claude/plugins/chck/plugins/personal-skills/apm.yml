# Package manifest so apm can consume this directory as a local dependency;
# see the personal-skills entry in config/apm/apm.yml. Without this file apm
# resolves the path but installs nothing, treating it as the project root.
#
# The .claude-plugin/ layout is kept so the directory also remains a valid
# Claude Code marketplace plugin. Keep name/version/description in sync with
# .claude-plugin/plugin.json, which is what apm actually records.
name: personal-skills
version: "1.0.1"
description: Personal workflow skills
author: chck
