[project]
name = "codex-config-sync"
dynamic = ["version"]

requires-python = ">=3.12,<3.15"
dependencies = ["tomlkit>=0.13,<1", "typer>=0.16,<1"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
fixable = ["ALL"]

[tool.ty.terminal]
error-on-warning = true
output-format = "full"
